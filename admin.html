<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel — Tirtomoyo EduApps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2317365D'/%3E%3Cstop offset='100%25' stop-color='%231769E0'/%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='url(%23grad)'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='34' font-weight='800' fill='%23ffffff' text-anchor='middle'%3ET%3C/text%3E%3Ccircle cx='52' cy='12' r='7' fill='%23E53935' stroke='%23ffffff' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="admin-shell" id="adminShell">
    <!-- Sidebar Admin -->
    <aside class="sidebar" id="adminSidebar">
      <div class="brand">
        <span class="brand-mark">T</span>
        <span>EduApps <span style="color:#FDA29B;">Admin</span></span>
      </div>

      <nav>
        <button data-tab="dashboard" class="active" onclick="switchAdminTab('dashboard')">
          <span>📊 Dashboard</span>
        </button>
        <button data-tab="submissions" onclick="switchAdminTab('submissions')">
          <span>📥 Pengajuan</span>
          <span id="badgeSubCount" class="pill-count" style="display:none;"></span>
        </button>
        <button data-tab="apps" onclick="switchAdminTab('apps')">
          <span>📱 Katalog Aplikasi</span>
        </button>
        <button data-tab="statistics" onclick="switchAdminTab('statistics')">
          <span>📈 Statistik</span>
        </button>
        <button data-tab="audit" onclick="switchAdminTab('audit')">
          <span>📜 Audit Log</span>
        </button>
        <button data-tab="manage_admins" id="btnTabManageAdmins" style="display:none;" onclick="switchAdminTab('manage_admins')">
          <span>👥 Kelola Admin</span>
        </button>
      </nav>

      <div class="who">
        <span class="muted small" style="color:#A9BCD6;display:block;">Login Akun:</span>
        <strong id="adminWho" style="word-break:break-all;">-</strong>
        <div id="adminRoleBadge" style="margin-top:.35rem;"></div>
        <button class="btn btn-secondary btn-sm" id="btnAdminLogout" style="margin-top:.75rem;width:100%;display:none;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2);" onclick="adminLogout()">Keluar (Logout)</button>
        <p style="margin-top:1rem;">
          <a href="index.html" style="color:#D0DCEC;text-decoration:none;" class="small">← Kembali ke Portal Publik</a>
        </p>
      </div>
    </aside>

    <!-- Konten Utama Admin -->
    <main class="admin-main" id="adminContent">
      <div style="padding: 3rem 1rem; text-align: center;">
        <div class="spinner"></div>
        <p class="muted">Memuat panel admin...</p>
      </div>
    </main>
  </div>

  <script>
/* ==========================================================================
   1. CLIENT UTILITIES & FETCH API RUNNER
   ========================================================================== */

var API_URL = 'https://script.google.com/macros/s/AKfycbyjAmofT2d-6T3uF2pfQ6WhD6eDzi5mz5tMsedp1AoiVTfoJ3_Hb2wHAV9asHmvKi7vZQ/exec';

var ADMIN_STATE = {
  token: localStorage.getItem('eduapps_admin_token') || null,
  session: null,
  activeTab: 'dashboard',
  submissionsPage: 1,
  submissionsFilter: '',
  submissionsStatus: '',
  appsPage: 1,
  appsFilter: '',
  appsStatus: '',
  auditPage: 1,
  auditFilter: '',
  categories: null
};

function callApi(functionName, payload) {
  var finalPayload = payload || {};
  if (ADMIN_STATE && ADMIN_STATE.token) {
    if (typeof finalPayload === 'object' && finalPayload !== null && !Array.isArray(finalPayload)) {
      if (!finalPayload.token) finalPayload.token = ADMIN_STATE.token;
    }
  }

  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: functionName,
      payload: finalPayload
    })
  })
  .then(function (res) {
    if (!res.ok) throw new Error('HTTP Error: ' + res.status);
    return res.json();
  })
  .then(function (response) {
    if (response && response.ok === true) {
      return response.data;
    } else {
      var err = (response && response.error) ? response.error : {
        code: 'INTERNAL_ERROR',
        message: 'Terjadi kesalahan sistem.'
      };
      throw err;
    }
  })
  .catch(function (err) {
    console.error('API Error:', err);
    throw (err.code ? err : { code: 'NETWORK_ERROR', message: err.message || 'Gagal terhubung ke database server.' });
  });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDateId(isoStr) {
  if (!isoStr) return '-';
  try {
    var d = new Date(isoStr);
    if (isNaN(d.getTime())) return String(isoStr);
    return d.toLocaleDateString('id-ID', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  } catch (e) {
    return String(isoStr);
  }
}

function normalizeScriptUrl(url) {
  if (!url) return '';
  var s = String(url).trim();
  if (/^html-app:\/\//i.test(s)) return s;
  var iframeMatch = s.match(/<iframe[^>]+src\s*=\s*["']([^"']+)["']/i);
  if (iframeMatch && iframeMatch[1]) {
    s = iframeMatch[1].trim();
  }
  return s.replace(/^https?:\/\/script\.google\.com\/(?:[^?#]*\/)?macros\/(?:[^\/]+\/)?s\//i, 'https://script.google.com/a/~/macros/s/');
}

function openHtmlSandboxTab_(htmlContent, title) {
  var rawHtml = String(htmlContent || '');
  var blob = new Blob([rawHtml], { type: 'text/html;charset=utf-8' });
  var blobUrl = URL.createObjectURL(blob);
  window.open(blobUrl, '_blank', 'noopener,noreferrer');
  setTimeout(function () {
    try { URL.revokeObjectURL(blobUrl); } catch (e) {}
  }, 60000);
}

function previewHtmlContainerByUrl_(targetUrl, title, triggerBtn) {
  var oldHtml = triggerBtn ? triggerBtn.innerHTML : '';
  if (triggerBtn) {
    triggerBtn.disabled = true;
    triggerBtn.textContent = '⏳ Membuka...';
  }
  callApi('api_getHtmlAppContent', { targetUrl: targetUrl }).then(function (res) {
    if (triggerBtn) {
      triggerBtn.disabled = false;
      triggerBtn.innerHTML = oldHtml;
    }
    openHtmlSandboxTab_(res.htmlContent, title || 'Pratinjau Aplikasi HTML');
  }).catch(function (err) {
    if (triggerBtn) {
      triggerBtn.disabled = false;
      triggerBtn.innerHTML = oldHtml;
    }
    showToast(err.message || 'Gagal membuka aplikasi HTML.', 'error');
  });
}

function createLaunchSourceField(prefix, initialUrl, labelText, required) {
  var wrap = document.createElement('div');
  wrap.className = 'field';
  wrap.id = 'wrap_' + prefix + '_launch';

  var lbl = document.createElement('label');
  lbl.className = 'label';
  lbl.innerHTML = escapeHtml(labelText || 'Sumber Aplikasi Pembelajaran') + (required ? ' <span class="req">*</span>' : '');
  wrap.appendChild(lbl);

  var hiddenInput = document.createElement('input');
  hiddenInput.type = 'hidden';
  hiddenInput.id = 'in_' + prefix + '_url';
  hiddenInput.value = initialUrl || '';
  wrap.appendChild(hiddenInput);

  var isInitialHtml = /^html-app:\/\//i.test(String(initialUrl || '').trim());
  var currentMode = isInitialHtml ? 'html' : 'url';

  var tabRow = document.createElement('div');
  tabRow.style.cssText = 'display:flex;gap:.5rem;margin-bottom:.65rem;flex-wrap:wrap;';

  var btnModeUrl = document.createElement('button');
  btnModeUrl.type = 'button';
  btnModeUrl.className = 'btn btn-sm ' + (currentMode === 'url' ? 'btn-primary' : 'btn-secondary');
  btnModeUrl.textContent = '🌐 Tautan Web / Kode Embed';

  var btnModeHtml = document.createElement('button');
  btnModeHtml.type = 'button';
  btnModeHtml.className = 'btn btn-sm ' + (currentMode === 'html' ? 'btn-primary' : 'btn-secondary');
  btnModeHtml.textContent = '📄 Kode HTML / Upload .html';

  tabRow.appendChild(btnModeUrl);
  tabRow.appendChild(btnModeHtml);
  wrap.appendChild(tabRow);

  var urlPanel = document.createElement('div');
  var visUrlInput = document.createElement('input');
  visUrlInput.type = 'text';
  visUrlInput.id = 'in_' + prefix + '_url_visible';
  visUrlInput.placeholder = 'https://script.google.com/... atau tempel kode <iframe src="...">';
  visUrlInput.value = isInitialHtml ? '' : (initialUrl || '');

  var urlHint = document.createElement('p');
  urlHint.className = 'small muted';
  urlHint.style.margin = '.35rem 0 0';
  urlHint.textContent = 'Mendukung tautan Web App Apps Script (termasuk belajar.id) maupun kode embed <iframe>.';

  var syncUrlValue = function () {
    var raw = visUrlInput.value.trim();
    var cleaned = normalizeScriptUrl(raw);
    if (cleaned && cleaned !== raw) {
      visUrlInput.value = cleaned;
      urlHint.textContent = 'Tautan berhasil diekstrak dan diseragamkan otomatis.';
      urlHint.style.color = '#059669';
    }
    hiddenInput.value = cleaned;
  };
  visUrlInput.addEventListener('input', function () {
    hiddenInput.value = normalizeScriptUrl(visUrlInput.value);
  });
  visUrlInput.addEventListener('blur', syncUrlValue);
  visUrlInput.addEventListener('change', syncUrlValue);

  urlPanel.appendChild(visUrlInput);
  urlPanel.appendChild(urlHint);
  wrap.appendChild(urlPanel);

  var htmlPanel = document.createElement('div');
  htmlPanel.style.cssText = 'border:1px solid var(--border);border-radius:10px;padding:.85rem;background:#F8FAFC;';

  var topTools = document.createElement('div');
  topTools.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem;';

  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.html,.htm,text/html';
  fileInput.style.display = 'none';

  var btnPickFile = document.createElement('button');
  btnPickFile.type = 'button';
  btnPickFile.className = 'btn btn-secondary btn-sm';
  btnPickFile.textContent = '📂 Pilih Berkas .html dari Perangkat';
  btnPickFile.onclick = function () { fileInput.click(); };

  var fileLabel = document.createElement('span');
  fileLabel.className = 'small muted';
  fileLabel.textContent = 'Maksimal 1,5 MB';

  topTools.appendChild(btnPickFile);
  topTools.appendChild(fileLabel);
  htmlPanel.appendChild(topTools);
  htmlPanel.appendChild(fileInput);

  var htmlArea = document.createElement('textarea');
  htmlArea.id = 'in_' + prefix + '_html_code';
  htmlArea.rows = 7;
  htmlArea.style.cssText = 'font-family:monospace;font-size:.82rem;background:#fff;';
  htmlArea.placeholder = 'Tempel kode <!DOCTYPE html>... lengkap di sini atau unggah berkas .html di atas...';
  htmlPanel.appendChild(htmlArea);

  var statusBox = document.createElement('div');
  statusBox.style.cssText = 'margin-top:.5rem;font-size:.82rem;';
  if (isInitialHtml) {
    statusBox.innerHTML = '<span style="color:#059669;font-weight:600;">✅ Berkas HTML sudah tersimpan (' + escapeHtml(initialUrl) + ').</span> <span class="muted">Tempel kode baru di atas jika ingin menggantinya.</span>';
  } else {
    statusBox.innerHTML = '<span class="muted">Tempel kode HTML lalu klik <strong>Simpan Kode HTML</strong> atau langsung simpan perubahan.</span>';
  }
  htmlPanel.appendChild(statusBox);

  var actionRow = document.createElement('div');
  actionRow.style.cssText = 'display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.65rem;';

  var btnPreviewHtml = document.createElement('button');
  btnPreviewHtml.type = 'button';
  btnPreviewHtml.className = 'btn btn-secondary btn-sm';
  btnPreviewHtml.textContent = '👁️ Pratinjau HTML';
  btnPreviewHtml.onclick = function () {
    var code = htmlArea.value.trim();
    if (!code) {
      if (/^html-app:\/\//i.test(hiddenInput.value)) {
        previewHtmlContainerByUrl_(hiddenInput.value, 'Pratinjau Aplikasi HTML', btnPreviewHtml);
        return;
      }
      showToast('Tempel kode HTML atau pilih berkas .html terlebih dahulu.', 'error');
      return;
    }
    openHtmlSandboxTab_(code, 'Pratinjau Aplikasi HTML');
  };

  var btnUploadHtml = document.createElement('button');
  btnUploadHtml.type = 'button';
  btnUploadHtml.className = 'btn btn-primary btn-sm';
  btnUploadHtml.textContent = '☁️ Simpan Kode HTML';

  var lastUploadedCode = '';
  var lastFileName = 'aplikasi.html';

  var uploadHtmlNow = function () {
    var code = htmlArea.value.trim();
    if (!code) {
      if (/^html-app:\/\//i.test(hiddenInput.value)) {
        return Promise.resolve(hiddenInput.value);
      }
      return Promise.reject(new Error('Kode HTML masih kosong.'));
    }
    if (code === lastUploadedCode && /^html-app:\/\//i.test(hiddenInput.value)) {
      return Promise.resolve(hiddenInput.value);
    }
    btnUploadHtml.disabled = true;
    btnUploadHtml.textContent = 'Menyimpan HTML...';
    statusBox.innerHTML = '<span style="color:#2563EB;">⏳ Mengunggah berkas HTML ke penyimpanan portal...</span>';

    return callApi('api_uploadHtmlApp', {
      htmlContent: code,
      fileName: lastFileName
    }).then(function (res) {
      btnUploadHtml.disabled = false;
      btnUploadHtml.textContent = '☁️ Simpan Kode HTML';
      lastUploadedCode = code;
      hiddenInput.value = res.targetUrl;
      statusBox.innerHTML = '<span style="color:#059669;font-weight:600;">✅ Kode HTML tersimpan (' + Math.round((res.sizeBytes || code.length) / 1024) + ' KB).</span>';
      return res.targetUrl;
    }).catch(function (err) {
      btnUploadHtml.disabled = false;
      btnUploadHtml.textContent = '☁️ Simpan Kode HTML';
      statusBox.innerHTML = '<span style="color:#DC2626;">❌ ' + escapeHtml(err.message || 'Gagal menyimpan HTML.') + '</span>';
      throw err;
    });
  };

  btnUploadHtml.onclick = function () {
    uploadHtmlNow().then(function () {
      showToast('Kode HTML berhasil disimpan ke server!', 'success');
    }).catch(function (err) {
      showToast(err.message || 'Gagal mengunggah kode HTML.', 'error');
    });
  };

  fileInput.onchange = function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (file.size > 1500000) {
      showToast('Ukuran file .html maksimal 1,5 MB.', 'error');
      fileInput.value = '';
      return;
    }
    lastFileName = file.name || 'aplikasi.html';
    fileLabel.textContent = 'Berkas: ' + lastFileName;
    var reader = new FileReader();
    reader.onload = function (ev) {
      htmlArea.value = String(ev.target.result || '');
      uploadHtmlNow().then(function () {
        showToast('Berkas ' + lastFileName + ' berhasil diunggah!', 'success');
      }).catch(function () {});
    };
    reader.readAsText(file, 'UTF-8');
  };

  htmlArea.addEventListener('input', function () {
    if (htmlArea.value.trim() !== lastUploadedCode && !isInitialHtml) {
      hiddenInput.value = '';
    }
  });

  actionRow.appendChild(btnPreviewHtml);
  actionRow.appendChild(btnUploadHtml);
  htmlPanel.appendChild(actionRow);
  wrap.appendChild(htmlPanel);

  var setMode = function (mode) {
    currentMode = mode;
    wrap.dataset.launchMode = mode;
    if (mode === 'url') {
      btnModeUrl.className = 'btn btn-sm btn-primary';
      btnModeHtml.className = 'btn btn-sm btn-secondary';
      urlPanel.style.display = 'block';
      htmlPanel.style.display = 'none';
      hiddenInput.value = normalizeScriptUrl(visUrlInput.value);
    } else {
      btnModeUrl.className = 'btn btn-sm btn-secondary';
      btnModeHtml.className = 'btn btn-sm btn-primary';
      urlPanel.style.display = 'none';
      htmlPanel.style.display = 'block';
    }
  };

  btnModeUrl.onclick = function () { setMode('url'); };
  btnModeHtml.onclick = function () { setMode('html'); };
  setMode(currentMode);

  wrap._resolveLaunchUrl = function () {
    if (currentMode === 'url') {
      syncUrlValue();
      return Promise.resolve(hiddenInput.value.trim());
    }
    return uploadHtmlNow();
  };

  return wrap;
}

function resolveLaunchUrlBeforeSubmit_(prefix) {
  var wrap = document.getElementById('wrap_' + prefix + '_launch');
  if (wrap && typeof wrap._resolveLaunchUrl === 'function') {
    return wrap._resolveLaunchUrl();
  }
  var inp = document.getElementById('in_' + prefix + '_url');
  return Promise.resolve(inp ? normalizeScriptUrl(inp.value) : '');
}

function ensureAdminCategories_() {
  if (ADMIN_STATE.categories) {
    return Promise.resolve(ADMIN_STATE.categories);
  }
  return callApi('api_listPublicCategories').then(function (cats) {
    ADMIN_STATE.categories = cats;
    return cats;
  });
}

function buildAdminTaxonomyFields_(prefix, selectedGrades, selectedSubjects, selectedCatId, cats) {
  var wrap = document.createDocumentFragment();
  var gradesSelected = Array.isArray(selectedGrades) ? selectedGrades : [];
  var subjectsSelected = Array.isArray(selectedSubjects) ? selectedSubjects : [];

  var fGrade = document.createElement('div');
  fGrade.className = 'field';
  fGrade.innerHTML = '<label class="label">Kelas Sasaran (SD) <span class="req">*</span></label>';
  var checksGrade = document.createElement('div');
  checksGrade.className = 'checks';
  var defaultGrades = [
    { id: 'SD1', label: 'Kelas 1' }, { id: 'SD2', label: 'Kelas 2' }, { id: 'SD3', label: 'Kelas 3' },
    { id: 'SD4', label: 'Kelas 4' }, { id: 'SD5', label: 'Kelas 5' }, { id: 'SD6', label: 'Kelas 6' }
  ];
  var gradeList = (cats && cats.grades && cats.grades.length) ? cats.grades : defaultGrades;
  gradeList.forEach(function (g) {
    var isChecked = gradesSelected.indexOf(g.id) !== -1 ? ' checked' : '';
    var lbl = document.createElement('label');
    lbl.className = 'check';
    lbl.innerHTML = '<input type="checkbox" name="' + prefix + '_gradeIds" value="' + escapeHtml(g.id) + '"' + isChecked + '> <span>' + escapeHtml(g.label) + '</span>';
    checksGrade.appendChild(lbl);
  });
  fGrade.appendChild(checksGrade);
  wrap.appendChild(fGrade);

  var fSub = document.createElement('div');
  fSub.className = 'field';
  fSub.innerHTML = '<label class="label">Mata Pelajaran <span class="req">*</span></label>';
  var checksSub = document.createElement('div');
  checksSub.className = 'checks';
  if (cats && cats.subjects) {
    cats.subjects.forEach(function (s) {
      var isChecked = subjectsSelected.indexOf(s.id) !== -1 ? ' checked' : '';
      var lbl = document.createElement('label');
      lbl.className = 'check';
      lbl.innerHTML = '<input type="checkbox" name="' + prefix + '_subjectIds" value="' + escapeHtml(s.id) + '"' + isChecked + '> <span>' + escapeHtml(s.label) + '</span>';
      checksSub.appendChild(lbl);
    });
  }
  fSub.appendChild(checksSub);
  wrap.appendChild(fSub);

  var fType = document.createElement('div');
  fType.className = 'field';
  fType.innerHTML = '<label for="in_' + prefix + '_catId" class="label">Jenis Media/Aplikasi <span class="req">*</span></label>';
  var selType = document.createElement('select');
  selType.id = 'in_' + prefix + '_catId';
  selType.innerHTML = '<option value="">-- Pilih Jenis Aplikasi --</option>';
  if (cats && cats.appTypes) {
    cats.appTypes.forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.label;
      if (selectedCatId === t.id) opt.selected = true;
      selType.appendChild(opt);
    });
  }
  fType.appendChild(selType);
  wrap.appendChild(fType);

  return wrap;
}

function showToast(message, type) {
  var wrap = document.getElementById('toastWrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  var toast = document.createElement('div');
  toast.className = 'toast ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
  toast.textContent = message;
  wrap.appendChild(toast);
  setTimeout(function () {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 4000);
}

function showConfirmModal(title, text, confirmBtnText, isDanger) {
  return new Promise(function (resolve) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';

    var modal = document.createElement('div');
    modal.className = 'modal';

    var h = document.createElement('h3');
    h.textContent = title;
    var p = document.createElement('p');
    p.textContent = text;
    p.className = 'muted small';

    var actions = document.createElement('div');
    actions.className = 'actions';

    var btnCancel = document.createElement('button');
    btnCancel.className = 'btn btn-secondary btn-sm';
    btnCancel.textContent = 'Batal';
    btnCancel.onclick = function () {
      document.body.removeChild(backdrop);
      resolve(false);
    };

    var btnConfirm = document.createElement('button');
    btnConfirm.className = 'btn btn-sm ' + (isDanger ? 'btn-danger' : 'btn-primary');
    btnConfirm.textContent = confirmBtnText || 'Lanjutkan';
    btnConfirm.onclick = function () {
      document.body.removeChild(backdrop);
      resolve(true);
    };

    actions.appendChild(btnCancel);
    actions.appendChild(btnConfirm);
    modal.appendChild(h);
    modal.appendChild(p);
    modal.appendChild(actions);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
  });
}

function showPromptModal(title, label, placeholder, confirmBtnText, minLength) {
  return new Promise(function (resolve) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';

    var modal = document.createElement('div');
    modal.className = 'modal';

    var h = document.createElement('h3');
    h.textContent = title;

    var field = document.createElement('div');
    field.className = 'field';
    field.style.marginTop = '1rem';
    field.innerHTML = '<label class="label">' + escapeHtml(label) + '</label>';

    var input = document.createElement('textarea');
    input.rows = 3;
    input.placeholder = placeholder || '';
    field.appendChild(input);

    var err = document.createElement('div');
    err.className = 'field-error';
    err.style.display = 'none';
    field.appendChild(err);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var btnCancel = document.createElement('button');
    btnCancel.className = 'btn btn-secondary btn-sm';
    btnCancel.textContent = 'Batal';
    btnCancel.onclick = function () {
      document.body.removeChild(backdrop);
      resolve(null);
    };

    var btnConfirm = document.createElement('button');
    btnConfirm.className = 'btn btn-danger btn-sm';
    btnConfirm.textContent = confirmBtnText || 'Kirim';
    btnConfirm.onclick = function () {
      var val = input.value.trim();
      if (minLength && val.length < minLength) {
        err.textContent = 'Harap isi minimal ' + minLength + ' karakter.';
        err.style.display = 'block';
        return;
      }
      document.body.removeChild(backdrop);
      resolve(val);
    };

    actions.appendChild(btnCancel);
    actions.appendChild(btnConfirm);
    modal.appendChild(h);
    modal.appendChild(field);
    modal.appendChild(actions);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
    input.focus();
  });
}

function createFormField(name, labelText, type, placeholder, required, helpText) {
  var div = document.createElement('div');
  div.className = 'field';

  var lbl = document.createElement('label');

  lbl.className = 'label';
  lbl.innerHTML = escapeHtml(labelText) + (required ? ' <span class="req">*</span>' : '');
  div.appendChild(lbl);

  var input;
  if (type === 'textarea') {
    input = document.createElement('textarea');
    input.rows = 3;
  } else {
    input = document.createElement('input');
    input.type = type;
  }
  input.id = 'in_' + name;
  input.name = name;
  input.placeholder = placeholder || '';
  div.appendChild(input);

  if (helpText) {
    var help = document.createElement('div');
    help.className = 'help';
    help.textContent = helpText;
    div.appendChild(help);
  }

  var err = document.createElement('div');
  err.className = 'field-error';
  err.style.display = 'none';
  div.appendChild(err);

  return div;
}

  var previewInfo = document.createElement('div');

  btnRemove.type = 'button';
  btnRemove.className = 'btn btn-secondary btn-sm';
  btnRemove.style.padding = '.25rem .6rem';

  previewWrap.appendChild(previewImg);

    btnChoose.disabled = true;

    statusSpan.textContent = 'Memproses & mengunggah "' + file.name + '"...';

    compressImageFile_(file, 1280, 0.78).then(function (result) {
      return callApi('api_uploadThumbnail', {

  err.className = 'field-error';
  err.style.display = 'none';
  div.appendChild(err);

  return div;
}

function compressImageFile_(file, maxWidth, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Gagal membaca file gambar.')); };
    reader.onload = function (e) {
      var img = new Image();
      img.onerror = function () { reject(new Error('File bukan gambar yang valid.')); };
      img.onload = function () {
        var w = img.width;
        var h = img.height;
        if (w > maxWidth) {
          h = Math.round((h * maxWidth) / w);
          w = maxWidth;
        }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var outMime = 'image/jpeg';
        var dataUrl = canvas.toDataURL(outMime, quality || 0.78);
        var safeBase = (file.name || 'thumbnail').replace(/\.[^/.]+$/, '').replace(/[^a-zA-Z0-9_-]/g, '_');
        var cleanFileName = safeBase + '.jpg';
        resolve({ dataUrl: dataUrl, mimeType: outMime, fileName: cleanFileName });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function initAdminApp() {
  if (!ADMIN_STATE.token) {
    renderAdminLoginForm();
    return;
  }
  loadAdminSession();
}

function loadAdminSession() {
  var sidebar = document.getElementById('adminSidebar');
  if (sidebar) sidebar.style.display = '';
  var shell = document.getElementById('adminShell');
  if (shell) {
    shell.style.display = '';
    shell.style.alignItems = '';
    shell.style.justifyContent = '';
  }

  var content = document.getElementById('adminContent');
  if (content) {
    content.innerHTML = '<div style="padding:3rem 1rem;text-align:center;"><div class="spinner"></div><p class="muted">Memeriksa hak akses admin...</p></div>';
  }

  callApi('api_adminGetSession', { token: ADMIN_STATE.token }).then(function (sess) {
    ADMIN_STATE.session = sess;

    var whoEl = document.getElementById('adminWho');
    if (whoEl) whoEl.textContent = sess.displayName || sess.email;

    var roleBadge = document.getElementById('adminRoleBadge');
    if (roleBadge) {
      var isSuper = sess.role === 'SUPERADMIN';
      roleBadge.innerHTML = '<span class="status ' + (isSuper ? 'st-APPROVED' : 'st-IN_REVIEW') + '" style="font-size:.72rem;padding:.1rem .5rem;">' +
        (isSuper ? '★ SUPERADMIN' : 'ADMIN KURATOR') + '</span>';
    }

    var btnLogout = document.getElementById('btnAdminLogout');
    if (btnLogout) btnLogout.style.display = 'block';

    var btnSuperTab = document.getElementById('btnTabManageAdmins');
    if (btnSuperTab) {
      btnSuperTab.style.display = (sess.role === 'SUPERADMIN') ? 'flex' : 'none';
    }

    callApi('api_listPublicCategories').then(function (cats) {
      ADMIN_STATE.categories = cats;
    });

    switchAdminTab('dashboard');
  }).catch(function (err) {
    ADMIN_STATE.token = null;
    localStorage.removeItem('eduapps_admin_token');
    renderAdminLoginForm(err.message || 'Sesi login berakhir. Silakan masuk kembali.');
  });
}

function adminLogout() {
  showConfirmModal('Konfirmasi Keluar', 'Yakin ingin keluar dari panel admin?', 'Keluar').then(function (ok) {
    if (ok) {
      ADMIN_STATE.token = null;
      ADMIN_STATE.session = null;
      localStorage.removeItem('eduapps_admin_token');
      window.location.href = 'index.html';
    }
  });
}

function switchAdminTab(tabName) {
  ADMIN_STATE.activeTab = tabName;
  document.querySelectorAll('.sidebar nav button').forEach(function (btn) {
    btn.classList.remove('active');
    if (btn.getAttribute('data-tab') === tabName) btn.classList.add('active');
  });

  var container = document.getElementById('adminContent');
  if (!container) return;

  if (tabName === 'dashboard') renderAdminDashboard(container);
  else if (tabName === 'submissions') renderAdminSubmissions(container);
  else if (tabName === 'apps') renderAdminApps(container);
  else if (tabName === 'statistics') renderAdminStatistics(container);
  else if (tabName === 'audit') renderAdminAudit(container);
  else if (tabName === 'manage_admins') renderAdminManageAdmins(container);
}

    } else {

function renderAdminSubmissions(container) {
  container.innerHTML = '<h2>Daftar Pengajuan Guru</h2><p class="muted">Tinjau, beri catatan revisi, edit informasi, atau setujui verifikasi aplikasi.</p>' +
    '<div class="toolbar">' +
    '<input type="search" id="admSubQuery" placeholder="Cari judul, guru, atau ID..." value="' + escapeHtml(ADMIN_STATE.submissionsFilter) + '">' +
    '<select id="admSubStatus"><option value="">Semua Status</option><option value="PENDING">PENDING</option><option value="IN_REVIEW">IN_REVIEW</option><option value="NEEDS_REVISION">NEEDS_REVISION</option><option value="APPROVED">APPROVED</option><option value="REJECTED">REJECTED</option></select>' +
    '<button class="btn btn-primary btn-sm" id="btnAdmSubFilter">Filter</button>' +
    '</div>' +
    '<div id="admSubTableWrap"><div class="spinner"></div></div>' +
    '<div id="admSubPager" class="pager"></div>';

  var inQ = document.getElementById('admSubQuery');

  selS.value = ADMIN_STATE.submissionsStatus || '';

  function applySubFilter() {
    ADMIN_STATE.submissionsFilter = inQ.value.trim();
    ADMIN_STATE.submissionsStatus = selS.value;
    ADMIN_STATE.submissionsPage = 1;
    loadAdminSubmissionsData(ADMIN_STATE.submissionsStatus);
  }

  btnF.onclick = applySubFilter;
  selS.onchange = applySubFilter;
  inQ.onkeydown = function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      applySubFilter();
    }

  loadAdminSubmissionsData(ADMIN_STATE.submissionsStatus);

function loadAdminSubmissionsData(statusFilter) {
  if (statusFilter === undefined) {
    statusFilter = ADMIN_STATE.submissionsStatus || '';
  } else {
    ADMIN_STATE.submissionsStatus = statusFilter;
  }
  var wrap = document.getElementById('admSubTableWrap');
  var pager = document.getElementById('admSubPager');
  if (!wrap) return;
  wrap.innerHTML = '<div class="spinner"></div>';

  callApi('api_adminListSubmissions', {
    page: ADMIN_STATE.submissionsPage,
    pageSize: 15,
    status: statusFilter ? [statusFilter] : [],
    query: ADMIN_STATE.submissionsFilter
  }).then(function (res) {
    if (!res.items || res.items.length === 0) {
      wrap.innerHTML = '<div class="state"><p class="muted">Tidak ada data pengajuan yang cocok.</p></div>';
      if (pager) pager.innerHTML = '';
      return;
    }

    var tbl = document.createElement('div');
    tbl.className = 'table-wrap';
    var t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Tgl Ajukan</th><th>Aplikasi</th><th>Guru / Sekolah</th><th>Mapel & Kelas</th><th>Status</th><th>Aksi</th></tr></thead>';
    var tbody = document.createElement('tbody');

    res.items.forEach(function (s) {
      var tr = document.createElement('tr');
      tr.id = 'row_sub_' + s.submissionId;
      tr.innerHTML = '<td style="white-space:nowrap;" class="small">' + formatDateId(s.submittedAt) + '</td>' +
        '<td><strong>' + escapeHtml(s.title) + '</strong><br><span class="code small">' + escapeHtml(s.submissionId) + '</span></td>' +
        '<td>' + escapeHtml(s.creatorName) + '<br><span class="muted small">' + escapeHtml(s.schoolName) + '</span></td>' +
        '<td><span class="small">' + escapeHtml((s.subjectLabels || []).join(', ')) + '</span><br><span class="muted small">' + escapeHtml((s.gradeLabels || []).join(', ')) + '</span></td>' +
        '<td><span class="status st-' + s.status + '" id="status_badge_' + s.submissionId + '">' + s.status + '</span></td>' +
        '<td><button class="btn btn-secondary btn-sm btn-act">Buka</button></td>';

      tr.querySelector('.btn-act').onclick = function () {
        openSubmissionDetailModal(s.submissionId);
      };
      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    tbl.appendChild(t);
    wrap.innerHTML = '';
    wrap.appendChild(tbl);

    if (pager) {
      pager.innerHTML = '';
      if (res.pagination.totalPages > 1) {
        if (res.pagination.page > 1) {
          var pBtn = document.createElement('button');
          pBtn.className = 'btn btn-secondary btn-sm';
          pBtn.textContent = '←';
          pBtn.onclick = function () { ADMIN_STATE.submissionsPage--; loadAdminSubmissionsData(statusFilter); };
          pager.appendChild(pBtn);
        }
        var pInfo = document.createElement('span');
        pInfo.className = 'small muted';
        pInfo.textContent = res.pagination.page + ' / ' + res.pagination.totalPages;
        pager.appendChild(pInfo);
        if (res.pagination.page < res.pagination.totalPages) {
          var nBtn = document.createElement('button');
          nBtn.className = 'btn btn-secondary btn-sm';
          nBtn.textContent = '→';
          nBtn.onclick = function () { ADMIN_STATE.submissionsPage++; loadAdminSubmissionsData(statusFilter); };
          pager.appendChild(nBtn);
        }
      }
    }
  }).catch(function (err) {
    wrap.innerHTML = '<div class="state error"><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

function openSubmissionDetailModal(submissionId) {
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = '780px';

  modal.style.overflowY = 'auto';

  modal.innerHTML = '<div class="spinner"></div><p style="text-align:center;">Memuat rincian pengajuan...</p>';
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  callApi('api_adminGetSubmissionDetail', { submissionId: submissionId }).then(function (s) {

    descBox.innerHTML = '<strong>Ringkasan:</strong><p class="muted small">' + escapeHtml(s.shortDescription) + '</p>' +
      '<strong>Deskripsi Lengkap:</strong><div class="prewrap muted small" style="background:#fff;border:1px solid var(--border);padding:.5rem;border-radius:6px;max-height:140px;overflow:auto;">' + escapeHtml(s.description) + '</div>';

      descBox.innerHTML += '<strong style="display:block;margin-top:.5rem;">Tujuan Belajar:</strong><p class="muted small">' + escapeHtml(s.learningObjective) + '</p>';

      var hist = document.createElement('div');
      hist.style.marginBottom = '1rem';
      hist.innerHTML = '<strong>Riwayat Catatan Review:</strong><div class="notes-log">' + escapeHtml(s.reviewNotes) + '</div>';
      content.appendChild(hist);
    }

    var actSection = document.createElement('div');
    actSection.style.borderTop = '1px solid var(--border)';
    actSection.style.paddingTop = '1rem';

    var hAct = document.createElement('h4');
    hAct.textContent = 'Aksi Peninjauan Admin';
    actSection.appendChild(hAct);

    var noteField = document.createElement('div');
    noteField.className = 'field';
    noteField.innerHTML = '<label for="admReviewNote" class="label">Catatan Review / Alasan Revisi / Penolakan</label>' +
      '<textarea id="admReviewNote" placeholder="Tuliskan catatan arahan guru atau alasan penolakan..."></textarea>';
    actSection.appendChild(noteField);

    var btnRow = document.createElement('div');
    btnRow.className = 'actions';

    if (s.allowedActions && s.allowedActions.indexOf('START_REVIEW') !== -1) {
      var bReview = document.createElement('button');
      bReview.className = 'btn btn-secondary btn-sm';
      bReview.textContent = 'Mulai Meninjau (In Review)';
      bReview.onclick = function () {
        submitReviewAction(s.submissionId, 'START_REVIEW', '', false, backdrop);
      };
      btnRow.appendChild(bReview);
    }

    if (s.allowedActions && s.allowedActions.indexOf('REQUEST_REVISION') !== -1) {
      var bRev = document.createElement('button');
      bRev.className = 'btn btn-secondary btn-sm';
      bRev.style.color = 'var(--warning)';
      bRev.textContent = 'Minta Revisi';
      bRev.onclick = function () {
        var note = modal.querySelector('#admReviewNote').value.trim();
        if (note.length < 5) {
          showToast('Harap tuliskan catatan instruksi perbaikan (min. 5 karakter).', 'error');
          return;
        }
        submitReviewAction(s.submissionId, 'REQUEST_REVISION', note, false, backdrop);
      };
      btnRow.appendChild(bRev);
    }

    if (s.allowedActions && s.allowedActions.indexOf('REJECT') !== -1) {
      var bRej = document.createElement('button');
      bRej.className = 'btn btn-danger btn-sm';
      bRej.textContent = 'Tolak Pengajuan';
      bRej.onclick = function () {
        var note = modal.querySelector('#admReviewNote').value.trim();
        if (note.length < 5) {
          showToast('Harap tuliskan alasan penolakan (min. 5 karakter).', 'error');
          return;
        }
        showConfirmModal('Konfirmasi Penolakan', 'Yakin menolak pengajuan ini? Aplikasi yang sedang tayang di katalog akan dinonaktifkan.', 'Tolak', true).then(function (ok) {
          if (ok) submitReviewAction(s.submissionId, 'REJECT', note, false, backdrop);
        });
      };
      btnRow.appendChild(bRej);
    }

    if (s.allowedActions && s.allowedActions.indexOf('APPROVE') !== -1) {
      var bApprPub = document.createElement('button');
      bApprPub.className = 'btn btn-success btn-sm';
      bApprPub.textContent = '✔ Verifikasi & Beri Badge';
      bApprPub.onclick = function () {
        var note = modal.querySelector('#admReviewNote').value.trim();
        showVerificationChecklistModal(s.title).then(function (verified) {
          if (verified) submitReviewAction(s.submissionId, 'APPROVE', note, true, backdrop);
        });
      };
      btnRow.appendChild(bApprPub);
    }

    actSection.appendChild(btnRow);
    content.appendChild(actSection);
    modal.appendChild(content);
  }).catch(function (err) {
    modal.innerHTML = '<div class="state error"><h3>Gagal Membuka Detail</h3><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

function submitReviewAction(submissionId, action, reviewNote, publish, backdrop) {
  if (backdrop && backdrop.parentNode) {
    backdrop.parentNode.removeChild(backdrop);
  }

  var targetStatus = {
    START_REVIEW: 'IN_REVIEW',
    REQUEST_REVISION: 'NEEDS_REVISION',
    APPROVE: 'APPROVED',
    REJECT: 'REJECTED'
  }[action] || action;

  var badge = document.getElementById('status_badge_' + submissionId);
  if (badge) {
    badge.className = 'status st-' + targetStatus;
    badge.textContent = targetStatus;
  }
  showToast('Status berhasil diubah menjadi ' + targetStatus, 'success');

  callApi('api_adminReviewSubmission', {
    submissionId: submissionId,
    action: action,
    reviewNote: reviewNote,
    publish: publish
  }).then(function () {
    var bSub = document.getElementById('badgeSubCount');
    if (bSub && bSub.textContent) {
      var n = parseInt(bSub.textContent, 10);
      if (n > 1) bSub.textContent = n - 1;
      else bSub.style.display = 'none';
    }
    if (ADMIN_STATE.activeTab === 'dashboard') {
      var cont = document.getElementById('adminContent');
      if (cont) renderAdminDashboard(cont);
    } else if (ADMIN_STATE.activeTab === 'submissions' && ADMIN_STATE.submissionsStatus) {
      loadAdminSubmissionsData(ADMIN_STATE.submissionsStatus);
    }
  }).catch(function (err) {
    showToast('Gagal sinkronisasi ke server: ' + (err.message || 'Terjadi kesalahan'), 'error');
    if (ADMIN_STATE.activeTab === 'dashboard') {
      var cont = document.getElementById('adminContent');
      if (cont) renderAdminDashboard(cont);
    } else {
      loadAdminSubmissionsData(ADMIN_STATE.submissionsStatus);
    }
  });
}

function renderAdminApps(container) {
  container.innerHTML = '<h2>Manajemen Aplikasi Terbit & Draf</h2><p class="muted">Ubah metadata, aktifkan/nonaktifkan aplikasi, atau tandai sebagai pilihan unggulan.</p>' +
    '<div class="toolbar">' +
    '<input type="search" id="admAppQuery" placeholder="Cari judul atau pengembang..." value="' + escapeHtml(ADMIN_STATE.appsFilter) + '">' +
    '<select id="admAppStatus"><option value="">Semua Status</option><option value="PUBLISHED">PUBLISHED (Terbit)</option><option value="DRAFT">DRAFT</option><option value="DISABLED">DISABLED (Nonaktif)</option></select>' +
    '<button class="btn btn-primary btn-sm" id="btnAdmAppFilter">Filter</button>' +
    '</div>' +
    '<div id="admAppTableWrap"><div class="spinner"></div></div>' +
    '<div id="admAppPager" class="pager"></div>';

  var btnF = document.getElementById('btnAdmAppFilter');
  var inQ = document.getElementById('admAppQuery');
  var selS = document.getElementById('admAppStatus');
  selS.value = ADMIN_STATE.appsStatus || '';

  function applyAppFilter() {
    ADMIN_STATE.appsFilter = inQ.value.trim();
    ADMIN_STATE.appsStatus = selS.value;
    ADMIN_STATE.appsPage = 1;
    loadAdminAppsData(ADMIN_STATE.appsStatus);
  }

  btnF.onclick = applyAppFilter;
  selS.onchange = applyAppFilter;
  inQ.onkeydown = function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      applyAppFilter();
    }
  };

  loadAdminAppsData(ADMIN_STATE.appsStatus);
}

function loadAdminAppsData(statusFilter) {
  if (statusFilter === undefined) {
    statusFilter = ADMIN_STATE.appsStatus || '';
  } else {
    ADMIN_STATE.appsStatus = statusFilter;
  }
  var wrap = document.getElementById('admAppTableWrap');
  var pager = document.getElementById('admAppPager');
  if (!wrap) return;
  wrap.innerHTML = '<div class="spinner"></div>';

  callApi('api_adminListApps', {
    page: ADMIN_STATE.appsPage,
    pageSize: 15,
    status: statusFilter ? [statusFilter] : [],
    query: ADMIN_STATE.appsFilter
  }).then(function (res) {
    if (!res.items || res.items.length === 0) {
      wrap.innerHTML = '<div class="state"><p class="muted">Belum ada aplikasi yang terdaftar dengan filter ini.</p></div>';
      if (pager) pager.innerHTML = '';
      return;
    }

    var tbl = document.createElement('div');
    tbl.className = 'table-wrap';
    var t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Aplikasi</th><th>Kelas & Mapel</th><th>Pengembang</th><th>Status</th><th>Unggulan</th><th>Aksi</th></tr></thead>';
    var tbody = document.createElement('tbody');

    res.items.forEach(function (app) {
      var isAppHtml = Boolean(app.isHtmlContainer || /^html-app:\/\//i.test(String(app.targetUrl || '')));
      var linkCell = isAppHtml
        ? '<button type="button" class="btn-link small btn-prev-html-row" style="padding:0;">📄 ' + escapeHtml(app.slug) + ' (Pratinjau HTML ↗)</button>'
        : '<a href="' + escapeHtml(app.targetUrl) + '" target="_blank" rel="noopener noreferrer" class="small muted">' + escapeHtml(app.slug) + ' ↗</a>';

      var tr = document.createElement('tr');
      tr.innerHTML = '<td><strong>' + escapeHtml(app.title) + '</strong> ' + (app.isVerified ? '<span style="color:#027A48;font-size:.78rem;">✔ Terverifikasi</span>' : '') + '<br>' + linkCell + '</td>' +
        '<td><span class="small">' + escapeHtml((app.gradeLabels || []).join(', ')) + '</span><br><span class="muted small">' + escapeHtml((app.subjectLabels || []).join(', ')) + '</span></td>' +
        '<td>' + escapeHtml(app.creatorName) + '<br><span class="muted small">' + escapeHtml(app.schoolName || '-') + '</span></td>' +
        '<td><span class="status st-' + app.status + '">' + app.status + '</span></td>' +
        '<td><input type="checkbox" class="cb-feat" ' + (app.featured ? 'checked' : '') + ' ' + (app.status !== 'PUBLISHED' ? 'disabled' : '') + ' title="Tandai aplikasi pilihan"></td>' +
        '<td><div class="actions"><button class="btn btn-secondary btn-sm btn-edit">Edit</button><button class="btn btn-sm btn-toggle-stat">' + (app.status === 'PUBLISHED' ? 'Nonaktifkan' : 'Terbitkan') + '</button></div></td>';

      var cbFeat = tr.querySelector('.cb-feat');
      cbFeat.onchange = function () {
        callApi('api_adminSetFeatured', { appId: app.appId, featured: cbFeat.checked }).then(function () {
          showToast(cbFeat.checked ? 'Ditandai sebagai unggulan.' : 'Dihapus dari unggulan.', 'success');
        }).catch(function (err) {
          cbFeat.checked = !cbFeat.checked;
          showToast(err.message, 'error');
        });
      };

      var btnPrevRow = tr.querySelector('.btn-prev-html-row');
      if (btnPrevRow) {
        btnPrevRow.onclick = function () {
          previewHtmlContainerByUrl_(app.targetUrl, app.title, btnPrevRow);
        };
      }

      tr.querySelector('.btn-edit').onclick = function () {
        openEditAppModal(app.appId);
      };

      var btnToggle = tr.querySelector('.btn-toggle-stat');
      if (app.status === 'PUBLISHED') {
        btnToggle.className += ' btn-danger';
        btnToggle.onclick = function () {
          showPromptModal('Konfirmasi Penonaktifan Aplikasi', 'Alasan penonaktifan aplikasi "' + app.title + '":', 'Tuliskan alasan penonaktifan...', 'Nonaktifkan', 5).then(function (reason) {
            if (!reason) return;
            callApi('api_adminSetAppStatus', { appId: app.appId, status: 'DISABLED', reason: reason }).then(function () {
              showToast('Aplikasi "' + app.title + '" berhasil dinonaktifkan.', 'success');
              loadAdminAppsData(statusFilter);
            }).catch(function (e) { showToast(e.message, 'error'); });
          });
        };
      } else {
        btnToggle.className += ' btn-primary';
        btnToggle.onclick = function () {
          showConfirmModal('Terbitkan Aplikasi', 'Aplikasi "' + app.title + '" akan dipublikasikan ke katalog publik.', 'Terbitkan').then(function (ok) {
            if (ok) {
              callApi('api_adminSetAppStatus', { appId: app.appId, status: 'PUBLISHED' }).then(function () {
                showToast('Aplikasi berhasil diterbitkan!', 'success');
                loadAdminAppsData(statusFilter);
              }).catch(function (e) { showToast(e.message, 'error'); });
            }
          });
        };
      }

      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    tbl.appendChild(t);
    wrap.innerHTML = '';
    wrap.appendChild(tbl);

    if (pager) {
      pager.innerHTML = '';
      if (res.pagination.totalPages > 1) {
        if (res.pagination.page > 1) {
          var pBtn = document.createElement('button');
          pBtn.className = 'btn btn-secondary btn-sm';
          pBtn.textContent = '←';
          pBtn.onclick = function () { ADMIN_STATE.appsPage--; loadAdminAppsData(statusFilter); };
          pager.appendChild(pBtn);
        }
        var pInfo = document.createElement('span');
        pInfo.className = 'small muted';
        pInfo.textContent = res.pagination.page + ' / ' + res.pagination.totalPages;
        pager.appendChild(pInfo);
        if (res.pagination.page < res.pagination.totalPages) {
          var nBtn = document.createElement('button');
          nBtn.className = 'btn btn-secondary btn-sm';
          nBtn.textContent = '→';
          nBtn.onclick = function () { ADMIN_STATE.appsPage++; loadAdminAppsData(statusFilter); };
          pager.appendChild(nBtn);
        }
      }
    }
  }).catch(function (err) {
    wrap.innerHTML = '<div class="state error"><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

function openEditAppModal(appId) {
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = '760px';
  modal.style.maxHeight = '90vh';
  modal.style.overflowY = 'auto';

  modal.innerHTML = '<div class="spinner"></div><p style="text-align:center;">Memuat data aplikasi...</p>';
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  Promise.all([
    callApi('api_adminGetApp', { appId: appId }),
    ensureAdminCategories_()
  ]).then(function (results) {
    var a = results[0];
    var cats = results[1];

    modal.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:.75rem;">' +
      '<h3 style="margin:0;">Edit Metadata: ' + escapeHtml(a.title) + '</h3>' +
      '<button class="btn btn-secondary btn-sm" id="btnCloseEditModal">✕</button>' +
      '</div>';

    modal.querySelector('#btnCloseEditModal').onclick = function () {
      document.body.removeChild(backdrop);
    };

    var form = document.createElement('form');
    form.style.marginTop = '1rem';

    form.appendChild(createFormField('edit_title', 'Nama Aplikasi', 'text', '', true));
    form.querySelector('#in_edit_title').value = a.title;

    form.appendChild(createFormField('edit_short', 'Ringkasan', 'text', '', true));
    form.querySelector('#in_edit_short').value = a.shortDescription;

    form.appendChild(createFormField('edit_desc', 'Deskripsi Lengkap', 'textarea', '', true));
    form.querySelector('#in_edit_desc').value = a.description;

    form.appendChild(createFormField('edit_obj', 'Tujuan Belajar', 'textarea', '', false));
    form.querySelector('#in_edit_obj').value = a.learningObjective || '';

    form.appendChild(buildAdminTaxonomyFields_('edit_app', a.gradeIds, a.subjectIds, a.categoryId, cats));

    form.appendChild(createLaunchSourceField('edit', a.targetUrl, 'Sumber Aplikasi Pembelajaran', true));

    form.appendChild(createThumbnailUploadField('edit_thumb', 'Gambar Sampul / Tangkapan Layar', a.thumbnailUrl || ''));

    form.appendChild(createFormField('edit_dev', 'Nama Pengembang', 'text', '', true));
    form.querySelector('#in_edit_dev').value = a.creatorName;

    form.appendChild(createFormField('edit_tags', 'Tags', 'text', '', false));
    form.querySelector('#in_edit_tags').value = (a.tags || []).join(', ');

    form.appendChild(createFormField('edit_notes', 'Catatan Internal Admin', 'textarea', '', false));
    form.querySelector('#in_edit_notes').value = a.adminNotes || '';

    var btnSave = document.createElement('button');
    btnSave.type = 'submit';
    btnSave.className = 'btn btn-primary btn-sm';
    btnSave.style.marginTop = '1rem';
    btnSave.textContent = 'Simpan Perubahan';
    form.appendChild(btnSave);

    form.onsubmit = function (e) {
      e.preventDefault();
      var grades = [];
      form.querySelectorAll('input[name="edit_app_gradeIds"]:checked').forEach(function (cb) { grades.push(cb.value); });
      var subjects = [];
      form.querySelectorAll('input[name="edit_app_subjectIds"]:checked').forEach(function (cb) { subjects.push(cb.value); });
      var catId = form.querySelector('#in_edit_app_catId').value;

      if (!grades.length) { showToast('Pilih minimal satu kelas SD.', 'error'); return; }
      if (!subjects.length) { showToast('Pilih minimal satu mata pelajaran.', 'error'); return; }
      if (!catId) { showToast('Pilih jenis media/aplikasi.', 'error'); return; }

      btnSave.disabled = true;
      btnSave.textContent = 'Menyimpan...';

      resolveLaunchUrlBeforeSubmit_('edit').then(function (resolvedUrl) {
        if (!resolvedUrl) {
          throw new Error('Sumber aplikasi wajib diisi.');
        }

        var payload = {
          appId: a.appId,
          title: form.querySelector('#in_edit_title').value.trim(),
          shortDescription: form.querySelector('#in_edit_short').value.trim(),
          description: form.querySelector('#in_edit_desc').value.trim(),
          learningObjective: form.querySelector('#in_edit_obj').value.trim(),
          targetUrl: resolvedUrl,
          thumbnailUrl: form.querySelector('#in_edit_thumb').value.trim(),
          creatorName: form.querySelector('#in_edit_dev').value.trim(),
          tags: form.querySelector('#in_edit_tags').value.trim(),
          adminNotes: form.querySelector('#in_edit_notes').value.trim(),
          subjectIds: subjects,
          gradeIds: grades,
          categoryId: catId
        };

        return callApi('api_adminUpdateApp', payload);
      }).then(function () {
        showToast('Perubahan aplikasi berhasil disimpan.', 'success');
        document.body.removeChild(backdrop);
        loadAdminAppsData(ADMIN_STATE.appsStatus);
      }).catch(function (err) {
        btnSave.disabled = false;
        btnSave.textContent = 'Simpan Perubahan';
        showToast(err.message || 'Gagal menyimpan.', 'error');
      });
    };

    modal.appendChild(form);
  }).catch(function (err) {
    modal.innerHTML = '<div class="state error"><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

    btnSave.className = 'btn btn-primary btn-sm';
    btnSave.style.marginTop = '1rem';
    btnSave.textContent = 'Simpan Perubahan Pengajuan';
    form.appendChild(btnSave);

    form.onsubmit = function (e) {
      e.preventDefault();
      var grades = [];
      form.querySelectorAll('input[name="edit_sub_gradeIds"]:checked').forEach(function (cb) { grades.push(cb.value); });
      var subjects = [];
      form.querySelectorAll('input[name="edit_sub_subjectIds"]:checked').forEach(function (cb) { subjects.push(cb.value); });
      var catId = form.querySelector('#in_edit_sub_catId').value;

      if (!grades.length) { showToast('Pilih minimal satu kelas SD.', 'error'); return; }
      if (!subjects.length) { showToast('Pilih minimal satu mata pelajaran.', 'error'); return; }
      if (!catId) { showToast('Pilih jenis media/aplikasi.', 'error'); return; }

      btnSave.disabled = true;
      btnSave.textContent = 'Menyimpan...';

      resolveLaunchUrlBeforeSubmit_('sub').then(function (resolvedUrl) {
        if (!resolvedUrl) {
          throw new Error('Sumber aplikasi wajib diisi.');
        }

        var payload = {
          submissionId: s.submissionId,
          title: form.querySelector('#in_sub_title').value.trim(),
          shortDescription: form.querySelector('#in_sub_short').value.trim(),
          description: form.querySelector('#in_sub_desc').value.trim(),
          learningObjective: form.querySelector('#in_sub_obj').value.trim(),
          targetUrl: resolvedUrl,
          thumbnailUrl: form.querySelector('#in_sub_thumb').value.trim(),
          creatorName: form.querySelector('#in_sub_dev').value.trim(),
          tags: form.querySelector('#in_sub_tags').value.trim(),
          subjectIds: subjects,
          gradeIds: grades,
          categoryId: catId
        };

        document.body.removeChild(backdrop);
        showToast('Menyimpan perubahan metadata...', 'info');

        return callApi('api_adminUpdateSubmission', payload);
      }).then(function (res) {
        showToast(res.message || 'Perubahan pengajuan berhasil disimpan!', 'success');
        if (onSuccess) onSuccess();
        else loadAdminSubmissionsData(ADMIN_STATE.submissionsStatus);
      }).catch(function (err) {
        btnSave.disabled = false;
        btnSave.textContent = 'Simpan Perubahan Pengajuan';
        showToast(err.message || 'Gagal menyimpan pengajuan.', 'error');
        if (!document.body.contains(backdrop)) {
          loadAdminSubmissionsData(ADMIN_STATE.submissionsStatus);
        }
      });
    };

    modal.appendChild(form);
  }).catch(function (err) {
    modal.innerHTML = '<div class="state error"><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

function showVerificationChecklistModal(title) {
  return new Promise(function (resolve) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';

    var modal = document.createElement('div');
    modal.className = 'modal';
    modal.style.maxWidth = '520px';

    modal.innerHTML = '<h3>Daftar Periksa Verifikasi Kelayakan</h3>' +
      '<p class="muted small">Pastikan poin kelayakan di bawah ini terpenuhi sebelum memberikan lencana <strong>✔ Terverifikasi</strong> pada aplikasi: <br><strong>' + escapeHtml(title) + '</strong></p>' +
      '<div style="display:flex;flex-direction:column;gap:.75rem;margin:1.25rem 0;" id="chkListWrap">' +
      '<label class="consent"><input type="checkbox" class="chk-item"> <span>Tautan web HTTPS sudah dibuka, berfungsi normal, dan dapat dimainkan/diakses siswa.</span></label>' +
      '<label class="consent"><input type="checkbox" class="chk-item"> <span>Materi dan tujuan pembelajaran sesuai untuk jenjang Sekolah Dasar (SD).</span></label>' +
      '<label class="consent"><input type="checkbox" class="chk-item"> <span>Bebas dari konten judi, pornografi, iklan mencurigakan, atau materi berbahaya.</span></label>' +
      '<label class="consent"><input type="checkbox" class="chk-item"> <span>Identitas nama guru dan sekolah asal valid.</span></label>' +
      '</div>' +
      '<div class="actions">' +
      '<button class="btn btn-secondary btn-sm" id="btnCancelVerify">Batal</button>' +
      '<button class="btn btn-success btn-sm" id="btnConfirmVerify" disabled>✔ Konfirmasi & Verifikasi</button>' +
      '</div>';

    var chks = modal.querySelectorAll('.chk-item');
    var btnConfirm = modal.querySelector('#btnConfirmVerify');

    function checkAll() {
      var allChecked = true;
      chks.forEach(function (c) { if (!c.checked) allChecked = false; });
      btnConfirm.disabled = !allChecked;
    }

    chks.forEach(function (c) {
      c.onchange = checkAll;
    });

    modal.querySelector('#btnCancelVerify').onclick = function () {
      document.body.removeChild(backdrop);
      resolve(false);
    };

    btnConfirm.onclick = function () {
      document.body.removeChild(backdrop);
      resolve(true);
    };

    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
  });
}

function loadAdminUsersData() {
  var wrap = document.getElementById('adminUserTableWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="spinner"></div>';

  callApi('api_superadminListAdmins').then(function (admins) {
    if (!admins || admins.length === 0) {
      wrap.innerHTML = '<div class="state"><p class="muted">Belum ada akun admin terdaftar.</p></div>';
      return;
    }

    var tbl = document.createElement('div');
    tbl.className = 'table-wrap';
    var t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Nama Lengkap</th><th>Email Akun</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead>';
    var tbody = document.createElement('tbody');

    admins.forEach(function (adm) {
      var tr = document.createElement('tr');
      var isSuper = adm.role === 'SUPERADMIN';
      tr.innerHTML = '<td><strong>' + escapeHtml(adm.name) + '</strong></td>' +
        '<td><code>' + escapeHtml(adm.email) + '</code></td>' +
        '<td><span class="status ' + (isSuper ? 'st-APPROVED' : 'st-IN_REVIEW') + '">' + escapeHtml(adm.role) + '</span></td>' +
        '<td>' + (adm.isActive ? '<span style="color:var(--success);font-weight:600;">Aktif</span>' : '<span style="color:var(--danger);font-weight:600;">Nonaktif</span>') + '</td>' +
        '<td><div class="actions">' +
        '<button class="btn btn-secondary btn-sm btn-edit-adm">Edit</button>' +
        (isSuper ? '' : '<button class="btn btn-danger btn-sm btn-del-adm">Hapus</button>') +
        '</div></td>';

      tr.querySelector('.btn-edit-adm').onclick = function () {
        openAdminUserModal(adm, function () { loadAdminUsersData(); });
      };

      var btnDel = tr.querySelector('.btn-del-adm');
      if (btnDel) {
        btnDel.onclick = function () {
          showConfirmModal('Hapus Akses Admin', 'Yakin menghapus admin ' + adm.email + '?', 'Hapus', true).then(function (ok) {
            if (ok) {
              callApi('api_superadminDeleteAdmin', { adminId: adm.adminId }).then(function () {
                showToast('Admin berhasil dihapus.', 'success');
                loadAdminUsersData();
              }).catch(function (e) { showToast(e.message, 'error'); });
            }
          });
        };
      }

      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    tbl.appendChild(t);
    wrap.innerHTML = '';
    wrap.appendChild(tbl);
  }).catch(function (err) {
    wrap.innerHTML = '<div class="state error"><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

function openAdminUserModal(adm, onSaved) {
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = '460px';

  var isEdit = !!adm;
  modal.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;">' +
    '<h3>' + (isEdit ? 'Ubah Data Admin' : 'Tambah Admin Baru') + '</h3>' +
    '<button class="btn btn-secondary btn-sm" id="btnCloseAdmModal">✕</button>' +
    '</div>';

  modal.querySelector('#btnCloseAdmModal').onclick = function () {
    document.body.removeChild(backdrop);
  };

  var form = document.createElement('form');
  form.style.marginTop = '1rem';

  form.appendChild(createFormField('adm_name', 'Nama Lengkap', 'text', 'Nama admin / kurator', true));
  if (isEdit) form.querySelector('#in_adm_name').value = adm.name;

  form.appendChild(createFormField('adm_email', 'Alamat Email', 'email', 'nama@gmail.com', true));
  if (isEdit) {
    var inEmail = form.querySelector('#in_adm_email');
    inEmail.value = adm.email;
    inEmail.readOnly = true;
  }

  form.appendChild(createFormField('adm_pass', isEdit ? 'Ganti Password (Kosongkan bila tidak diubah)' : 'Password Akun', 'password', '••••••••', !isEdit));

  var fRole = document.createElement('div');
  fRole.className = 'field';
  fRole.innerHTML = '<label class="label">Role Akses</label>' +
    '<select id="in_adm_role"><option value="ADMIN">ADMIN (Kurator Aplikasi)</option><option value="SUPERADMIN">SUPERADMIN (Hak Penuh & Kelola Admin)</option></select>';
  if (isEdit && adm.role === 'SUPERADMIN') fRole.querySelector('#in_adm_role').value = 'SUPERADMIN';
  form.appendChild(fRole);

  var btnSubmit = document.createElement('button');
  btnSubmit.type = 'submit';
  btnSubmit.className = 'btn btn-primary btn-sm';
  btnSubmit.style.marginTop = '1rem';
  btnSubmit.textContent = isEdit ? 'Simpan Perubahan' : 'Daftarkan Admin';
  form.appendChild(btnSubmit);

  form.onsubmit = function (e) {
    e.preventDefault();
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Memproses...';

    var payload = {
      name: form.querySelector('#in_adm_name').value.trim(),
      email: form.querySelector('#in_adm_email').value.trim(),
      password: form.querySelector('#in_adm_pass').value,
      role: form.querySelector('#in_adm_role').value
    };

    callApi('api_superadminSaveAdmin', payload).then(function (res) {
      showToast(res.message || 'Data admin berhasil disimpan.', 'success');
      document.body.removeChild(backdrop);
      if (onSaved) onSaved();
    }).catch(function (err) {
      btnSubmit.disabled = false;
      btnSubmit.textContent = isEdit ? 'Simpan Perubahan' : 'Daftarkan Admin';
      showToast(err.message || 'Gagal menyimpan admin.', 'error');
    });
  };

  modal.appendChild(form);
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
}

        return '<div class="state"><p class="muted">Belum ada data statistik.</p></div>';
      }
      var maxVal = Math.max.apply(null, items.map(function (it) { return Number(it[valueKey] || 0); }).concat([1]));
      return items.map(function (it) {
        var primaryVal = Number(it[valueKey] || 0);
        var secondaryVal = Number(it[secondaryKey] || 0);
        var pct = Math.round((primaryVal / maxVal) * 100);
        var isZero = primaryVal === 0 && secondaryVal === 0;

          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:.88rem;margin-bottom:.25rem;">' +

        '<strong style="color:#B54708;font-size:.86rem;">⚠️ ' + stats.inactiveSchools.length + ' SD Terdaftar Belum Mengunggah Karya:</strong>' +
        '<p class="small" style="margin:.35rem 0 0;color:#7A271A;line-height:1.5;">' +
        stats.inactiveSchools.map(function (s) { return escapeHtml(s.schoolName); }).join(', ') +
        '</p></div>';
    }

    panelSchools.innerHTML = '<h3 style="margin:0 0 .2rem;">🏫 Sekolah Paling Aktif Mengunggah</h3>' +
      '<p class="small muted" style="margin:0 0 .85rem;">Peringkat kontribusi karya per Sekolah Dasar di Kecamatan Tirtomoyo.</p>' +
      (schRows
        ? '<div class="table-wrap"><table><thead><tr><th>#</th><th>Sekolah</th><th>Karya</th><th>Total Main</th></tr></thead><tbody>' + schRows + '</tbody></table></div>'
        : '<div class="state"><p class="muted">Belum ada data sekolah.</p></div>') +
      inactiveListHtml;

    var panelTeachers = document.createElement('div');
    panelTeachers.className = 'panel';
    panelTeachers.style.marginTop = '0';
    var tchRows = (stats.topTeachers || []).map(function (t, idx) {
      return '<tr>' +
        '<td style="font-weight:700;">#' + (idx + 1) + '</td>' +
        '<td><strong>' + escapeHtml(t.teacherName) + '</strong><br><span class="small muted">' + escapeHtml(t.schoolName) + '</span></td>' +
        '<td style="font-weight:700;color:var(--navy);">' + t.appCount + ' karya</td>' +
        '<td class="small" style="color:var(--blue);font-weight:600;">▶ ' + (t.totalPlays || 0).toLocaleString('id-ID') + 'x</td>' +
      '</tr>';
    }).join('');

    panelTeachers.innerHTML = '<h3 style="margin:0 0 .2rem;">👨‍🏫 Guru Pengembang Paling Produktif</h3>' +
      '<p class="small muted" style="margin:0 0 .85rem;">Top 15 guru dengan jumlah karya terbanyak dan total pemutarannya.</p>' +
      (tchRows
        ? '<div class="table-wrap"><table><thead><tr><th>#</th><th>Nama Guru & Sekolah</th><th>Karya</th><th>Total Main</th></tr></thead><tbody>' + tchRows + '</tbody></table></div>'
        : '<div class="state"><p class="muted">Belum ada data guru pengembang.</p></div>');

    rowRankings.appendChild(panelSchools);
    rowRankings.appendChild(panelTeachers);
    container.appendChild(rowRankings);

    if (stats.monthlyTrend && stats.monthlyTrend.length > 0) {
      var panelTrend = document.createElement('div');
      panelTrend.className = 'panel';
      var trendItems = stats.monthlyTrend.map(function (m) {
        return { label: m.month, appCount: m.appCount, totalPlays: m.totalPlays };
      });
      panelTrend.innerHTML = '<h3 style="margin:0 0 .2rem;">📅 Tren Publikasi Aplikasi per Bulan</h3>' +
        '<p class="small muted" style="margin:0 0 .85rem;">Perkembangan jumlah aplikasi yang diterbitkan setiap bulan.</p>' +
        buildBarListHtml(trendItems, 'appCount', 'totalPlays', ' aplikasi baru', 'x total main', '');
      container.appendChild(panelTrend);
    }
  }).catch(function (err) {
    container.innerHTML = '<div class="state error"><h3>Gagal Memuat Statistik</h3><p>' + escapeHtml(err.message || 'Terjadi kesalahan server.') + '</p></div>';
  });
}

function exportAdminStatisticsCsv_(stats) {
  var rows = [];
  var esc = function (v) {
    var s = String(v === null || v === undefined ? '' : v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };

  rows.push(['RINGKASAN STATISTIK TIRTOMOYO EDUAPPS']);
  rows.push(['Metrik', 'Nilai']);
  var ov = stats.overview || {};
  rows.push(['Total Aplikasi Terbit', ov.totalPublishedApps || 0]);
  rows.push(['Total Pemutaran', ov.totalPlays || 0]);
  rows.push(['Rata-rata Pemutaran per Aplikasi', ov.avgPlaysPerApp || 0]);
  rows.push(['Aplikasi Terverifikasi', ov.verifiedCount || 0]);
  rows.push(['Aplikasi HTML Container', ov.htmlContainerCount || 0]);
  rows.push(['Aplikasi Tautan Web/GAS', ov.webUrlCount || 0]);
  rows.push(['SD Berkontribusi', (ov.contributingSchoolsCount || 0) + ' dari ' + (ov.totalRegisteredSchools || 0)]);
  rows.push(['Guru Pengembang Aktif', ov.contributingTeachersCount || 0]);
  rows.push([]);

  rows.push(['STATISTIK MATA PELAJARAN']);
  rows.push(['Mata Pelajaran', 'Jumlah Aplikasi', 'Total Dimainkan']);
  (stats.subjectStats || []).forEach(function (s) {
    rows.push([s.label, s.appCount, s.totalPlays]);
  });
  rows.push([]);

  rows.push(['PERINGKAT SEKOLAH PALING AKTIF']);
  rows.push(['Peringkat', 'Nama Sekolah', 'NPSN', 'Jumlah Karya', 'Total Dimainkan']);
  (stats.topSchools || []).forEach(function (s, idx) {
    rows.push([idx + 1, s.schoolName, s.npsn, s.appCount, s.totalPlays]);
  });
  rows.push([]);

  rows.push(['PERINGKAT GURU PALING PRODUKTIF']);
  rows.push(['Peringkat', 'Nama Guru', 'Asal Sekolah', 'Jumlah Karya', 'Total Dimainkan']);
  (stats.topTeachers || []).forEach(function (t, idx) {
    rows.push([idx + 1, t.teacherName, t.schoolName, t.appCount, t.totalPlays]);
  });
  rows.push([]);

  rows.push(['TOP 15 APLIKASI PALING POPULER']);
  rows.push(['Peringkat', 'Judul Aplikasi', 'Mata Pelajaran', 'Kelas', 'Pengembang', 'Sekolah', 'Total Dimainkan']);
  (stats.topPopularApps || []).forEach(function (a, idx) {
    rows.push([
      idx + 1,
      a.title,
      (a.subjectLabels || []).join('; '),
      (a.gradeLabels || []).join('; '),
      a.creatorName,
      a.schoolName,
      a.playCount
    ]);
  });

  var csvContent = '\uFEFF' + rows.map(function (r) {
    return r.map(esc).join(',');
  }).join('\n');

  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Statistik_Tirtomoyo_EduApps_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  showToast('Laporan statistik CSV berhasil diunduh!', 'success');
}

function renderAdminAudit(container) {
  container.innerHTML = '<h2>Riwayat Audit Log</h2><p class="muted">Catatan jejak aktivitas admin, persetujuan, dan perubahan status.</p>' +
    '<div class="toolbar">' +
    '<input type="search" id="admAuditQuery" placeholder="Cari aktor, aksi, ID target, atau ringkasan..." value="' + escapeHtml(ADMIN_STATE.auditFilter) + '">' +
    '<button type="button" class="btn btn-primary btn-sm" id="btnAdmAuditFilter">Cari</button>' +
    '<button type="button" class="btn btn-secondary btn-sm" id="btnAdmAuditReset">Reset</button>' +
    '</div>' +
    '<div id="admAuditTableWrap"><div class="spinner"></div></div>' +
    '<div id="admAuditPager" class="pager"></div>';

  var inQ = document.getElementById('admAuditQuery');
  var btnF = document.getElementById('btnAdmAuditFilter');
  var btnR = document.getElementById('btnAdmAuditReset');

  btnF.onclick = function () {
    ADMIN_STATE.auditFilter = inQ.value.trim();
    ADMIN_STATE.auditPage = 1;
    loadAdminAuditData();
  };

  inQ.onkeydown = function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      btnF.click();
    }
  };

  btnR.onclick = function () {
    inQ.value = '';
    ADMIN_STATE.auditFilter = '';
    ADMIN_STATE.auditPage = 1;
    loadAdminAuditData();
  };

  loadAdminAuditData();
}

function loadAdminAuditData() {
  var wrap = document.getElementById('admAuditTableWrap');
  var pager = document.getElementById('admAuditPager');
  if (!wrap) return;
  wrap.innerHTML = '<div class="spinner"></div>';

  callApi('api_adminListAuditLog', {
    page: ADMIN_STATE.auditPage,
    pageSize: 25,
    query: ADMIN_STATE.auditFilter
  }).then(function (res) {
    if (!res.items || res.items.length === 0) {
      wrap.innerHTML = '<div class="state"><p class="muted">Belum ada catatan audit log yang cocok.</p></div>';
      if (pager) pager.innerHTML = '';
      return;
    }

    var tbl = document.createElement('div');
    tbl.className = 'table-wrap';
    var t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Target</th><th>Ringkasan</th></tr></thead>';
    var tbody = document.createElement('tbody');

    res.items.forEach(function (l) {
      var tr = document.createElement('tr');
      var targetDisplay = l.targetName && l.targetName !== l.entityId
        ? '<strong>' + escapeHtml(l.targetName) + '</strong><br><span class="code small">' + escapeHtml(l.entityId) + '</span>'
        : '<code>' + escapeHtml(l.entityId) + '</code>';

      tr.innerHTML = '<td style="white-space:nowrap;" class="small">' + formatDateId(l.timestamp) + '</td>' +
        '<td class="small"><code>' + escapeHtml(l.actorId) + '</code></td>' +
        '<td class="small"><strong>' + escapeHtml(l.action) + '</strong></td>' +
        '<td class="small">' + escapeHtml(l.entityType) + ':<br>' + targetDisplay + '</td>' +
        '<td class="small">' + escapeHtml(l.summary) + '</td>';
      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    tbl.appendChild(t);
    wrap.innerHTML = '';
    wrap.appendChild(tbl);

    if (pager) {
      pager.innerHTML = '';
      if (res.pagination.totalPages > 1) {
        if (res.pagination.page > 1) {
          var pBtn = document.createElement('button');
          pBtn.className = 'btn btn-secondary btn-sm';
          pBtn.textContent = '←';
          pBtn.onclick = function () { ADMIN_STATE.auditPage--; loadAdminAuditData(); };
          pager.appendChild(pBtn);
        }
        var pInfo = document.createElement('span');
        pInfo.className = 'small muted';
        pInfo.textContent = res.pagination.page + ' / ' + res.pagination.totalPages;
        pager.appendChild(pInfo);
        if (res.pagination.page < res.pagination.totalPages) {
          var nBtn = document.createElement('button');
          nBtn.className = 'btn btn-secondary btn-sm';
          nBtn.textContent = '→';
          nBtn.onclick = function () { ADMIN_STATE.auditPage++; loadAdminAuditData(); };
          pager.appendChild(nBtn);
        }
      }
    }
  }).catch(function (err) {
    wrap.innerHTML = '<div class="state error"><p>' + escapeHtml(err.message) + '</p></div>';
  });
}

  initAdminApp();
